<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Nhập Key</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #34495e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
        }
        h2 { margin-top: 0; margin-bottom: 20px; color: #3498db; text-align: center; }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
            color: #bdc3c7;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover { background-color: #2980b9; }
        
        /* Nút bấm lấy key nhỏ gọn */
        .btn-get-key {
            background-color: #e67e22;
            font-size: 14px;
            padding: 8px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .btn-get-key:hover { background-color: #d35400; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Nhập Thông Tin Key</h2>
        
        <label>Nhập Link / Key chính:</label>
        <input type="text" id="mainKey" placeholder="Dán link hoặc key chính vào đây...">

        <!-- Ô Key 3D -->
        <label>Key 3D:</label>
        <input type="text" id="key3d" placeholder="Nhập Key 3D...">
        <button class="btn-get-key" onclick="layKey3D()">Bấm để lấy Key 3D</button>

        <!-- Ô Key VV -->
        <label>Key VV:</label>
        <input type="text" id="keyVV" placeholder="Nhập Key VV...">
        <button class="btn-get-key" onclick="layKeyVV()">Bấm để lấy Key VV</button>

        <hr style="border-color: #7f8c8d; margin: 20px 0;">

        <button onclick="xacNhanKey()">Xác Nhận Tất Cả</button>
    </div>

    <script>
        // Hàm xử lý khi bấm lấy Key 3D
        function layKey3D() {
            // Tự động điền key vào ô
            document.getElementById('key3d').value = "mkhuong-1dskqk239";
            alert("Đã lấy Key 3D thành công! Mời bạn mở link fnote để kích hoạt.");
            // Tự động mở link fnote
            window.open("https://fnote.net/notes/8rp8KV", "_blank");
        }

        // Hàm xử lý khi bấm lấy Key VV
        function layKeyVV() {
            // Tự động điền key vào ô
            document.getElementById('keyVV').value = "mkhuong-vinhvi3n-ddmdk2";
            alert("Đã lấy Key VV thành công! Mời bạn mở link fnote để kích hoạt.");
            // Tự động mở link fnote
            window.open("https://fnote.net/notes/6gNv38", "_blank");
        }

        // Hàm xác nhận
        function xacNhanKey() {
            var main = document.getElementById('mainKey').value;
            var k3d = document.getElementById('key3d').value;
            var kvv = document.getElementById('keyVV').value;

            if (main === "" || k3d === "" || kvv === "") {
                alert("Vui lòng nhập đầy đủ thông tin các ô!");
                return;
            }

            alert("Đã nhận đủ thông tin!\nHệ thống đang tiến hành xử lý...");
        }
    </script>

</body>
</html>
